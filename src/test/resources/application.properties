# Tests use an in-memory H2 database, so no Postgres is needed.
# Redis is not needed either: the integration test replaces TokenBlacklistService with a mock.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-only-secret-key-that-is-comfortably-longer-than-32-bytes
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173

spring.data.redis.host=localhost
spring.data.redis.port=6379
